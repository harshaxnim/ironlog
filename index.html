<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Iron Log — Workout Tracker</title>
  <!-- Icons: .ico for the bare /favicon.ico request, SVG where it is supported, PNG for
       iOS home screens. Paths are relative — the site is served from a subpath on Pages. -->
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Iron Log" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Chart.js for the progress graph -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <header id="header" class="header"></header>
  <main id="app"></main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
